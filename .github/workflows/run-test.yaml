name: Run tests

on:
  # dispatch-only on the CI fork; upstream's push trigger is not usable here
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest expression passed through tox as posargs"
        required: false
        default: ""

env:
  # resolve every dependency as it existed at the 1.2.4 release date
  PIP_INDEX_URL: "https://:2022-11-15T14:37:53@time-machines-pypi.sealsecurity.io/"

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-22.04"
          - "windows-2022"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-2022"
            python-version: "3.10"
          # the only macOS runners available to this fork are arm64, and
          # CPython 3.7/3.8 predate macOS arm64 support, so no prebuilt exists
          # and neither can be compiled there. 3.9 and 3.10 keep macOS covered.
          - os: "macos-latest"
            python-version: "3.7"
          - os: "macos-latest"
            python-version: "3.8"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up python
        if: matrix.os != 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      # arm64 macOS: actions/setup-python has no manifest entry for these
      # CPythons; this drop-in resolves a prebuilt arm64 build or compiles one.
      - name: Set up python (arm64 macOS)
        if: matrix.os == 'macos-latest'
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools
          # some runners preinstall a setuptools newer than the release-era
          # packaging tox resolves, and --upgrade will not downgrade it;
          # pin it explicitly so setup.py sdist works on every leg
          pip install "setuptools==65.5.1"
          pip list

      - name: Run tests
        run: tox -- ${{ inputs.test-filter }}

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.10'
        run: |
          pip install "setuptools==65.5.1" "wheel==0.38.4" "build==0.9.0"
          python -m build --no-isolation

      - name: Upload distributions
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
